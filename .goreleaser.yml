version: 2

before:
  hooks:
    - go mod tidy

builds:
  - env:
      # The Registry requires static binaries.
      - CGO_ENABLED=0
    mod_timestamp: "{{ .CommitTimestamp }}"
    flags:
      - -trimpath
    ldflags:
      - "-s -w -X main.version={{.Version}}"
    goos:
      - freebsd
      - windows
      - linux
      - darwin
    goarch:
      - "386"
      - amd64
      - arm
      - arm64
    ignore:
      - goos: darwin
        goarch: "386"
    binary: "{{ .ProjectName }}_v{{ .Version }}"

archives:
  - formats: [zip]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"

checksum:
  extra_files:
    - glob: terraform-registry-manifest.json
      name_template: "{{ .ProjectName }}_{{ .Version }}_manifest.json"
  name_template: "{{ .ProjectName }}_{{ .Version }}_SHA256SUMS"
  algorithm: sha256

signs:
  - artifacts: checksum
    args:
      - --batch
      - --local-user
      - "{{ .Env.GPG_FINGERPRINT }}"
      - --output
      - "${signature}"
      - --detach-sign
      - "${artifact}"

# GoReleaser never creates the release itself. Builds run with `--skip=publish`, and the
# resulting archives, checksums and signature are attached to the draft release opened by
# draft-release.yml, which is then un-drafted — that is what creates the git tag the
# Terraform Registry ingests. The protocol manifest is attached the same way, and
# `checksum.extra_files` above records its hash in SHA256SUMS.
release:
  disable: true

changelog:
  disable: true
