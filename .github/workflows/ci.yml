name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.11.4

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test -race ./...

  integration:
    name: Integration
    # Real-API tests need the MAILTRAP_API_TOKEN secret, which fork PRs can't
    # read — they are covered by the mock acceptance tests above. Gated on the
    # fast tests so broken changes never touch the shared test account.
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    needs: [test]
    # Same group as integration.yml's schedule/dispatch runs — the tests must
    # never overlap in the shared account (single-project plan, prefix sweep).
    concurrency:
      group: integration
      cancel-in-progress: false
    uses: ./.github/workflows/integration.yml
    with:
      environment: integration
    secrets: inherit

  docs:
    name: Docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: Generate docs
        run: go generate ./...
      - name: Fail if docs are out of date
        run: git diff --exit-code -- docs/ || (echo "docs/ is out of date; run 'go generate ./...' and commit the result" && exit 1)
