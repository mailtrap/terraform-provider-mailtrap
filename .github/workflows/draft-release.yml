# Drafts a new terraform-provider-mailtrap release: computes the next version from the
# latest GitHub release and opens a draft release carrying the generated notes.
#
# Unlike the other SDKs there is no version file, CHANGELOG or pinned version in the
# README to bump, so no release PR is opened — the draft release alone carries the
# version. `publish-sdk-release.yml` in railsware/mailtrap-ga-workflows then reads the
# draft, builds and GPG-signs the artifacts with GoReleaser, attaches them, and
# un-drafts the release. Un-drafting creates the git tag the Terraform Registry ingests.
name: Draft Release

on:
  workflow_dispatch:
    inputs:
      bump_type:
        description: "Semver bump type"
        required: true
        type: choice
        options:
          - patch
          - minor
          - major
        default: patch

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  draft-release:
    name: Draft terraform-provider-mailtrap Release
    runs-on: ubuntu-latest
    # Every step works through the GitHub API, so no checkout is needed.
    steps:
      # There is no latest release before the first one — fall back to 0.0.0 so that
      # `bump_type: minor` yields the initial v0.1.0.
      - name: Read current version from latest release
        id: read
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          latest=$(gh api "repos/$GITHUB_REPOSITORY/releases/latest" --jq '.tag_name' 2>/dev/null || echo "")
          version="${latest#v}"
          echo "version=${version:-0.0.0}" >> "$GITHUB_OUTPUT"

      - name: Compute next version
        id: bump
        uses: railsware/github-actions/compute-next-semver@master
        with:
          current: ${{ steps.read.outputs.version }}
          bump-type: ${{ inputs.bump_type }}

      - name: Abort if tag already exists
        uses: railsware/github-actions/abort-if-tag-exists@master
        with:
          tag: ${{ steps.bump.outputs.tag }}

      - name: Generate release notes
        id: notes
        uses: railsware/github-actions/generate-release-notes@master
        with:
          tag: ${{ steps.bump.outputs.tag }}

      # Empty notes mean nothing landed since the last release, so there is nothing
      # to publish — leave the draft uncreated rather than shipping an empty version.
      - name: Create draft GitHub release
        if: steps.notes.outputs.release_notes != ''
        uses: railsware/github-actions/create-draft-github-release@master
        with:
          tag: ${{ steps.bump.outputs.tag }}
          release-notes: ${{ steps.notes.outputs.release_notes }}
